name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to publish or refresh
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: >-
          dotnet publish .\dashboard\EcoPulse.Dashboard.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output "${{ runner.temp }}\EcoPulse-Windows-x64"
          --nologo

      - name: Assemble portable package
        shell: pwsh
        run: |
          Copy-Item .\README.txt "${{ runner.temp }}\EcoPulse-Windows-x64\README.txt"
          Copy-Item .\dashboard\ecopulse.ico "${{ runner.temp }}\EcoPulse-Windows-x64\ecopulse.ico"
          Compress-Archive `
            -Path "${{ runner.temp }}\EcoPulse-Windows-x64\*" `
            -DestinationPath "${{ runner.temp }}\EcoPulse-Windows-x64.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          $archive = "${{ runner.temp }}\EcoPulse-Windows-x64.zip"
          gh release view "$env:TAG_NAME" --repo "$env:GITHUB_REPOSITORY" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG_NAME" $archive `
              --repo "$env:GITHUB_REPOSITORY" --clobber
          }
          else {
            gh release create "$env:TAG_NAME" $archive `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "EcoPulse $env:TAG_NAME" `
              --notes-file README.md
          }
